<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - ALL-IN-ONE.COM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            ALL-IN-ONE.COM
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="videos.html">
                Videos
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- SIGNUP -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Create Account
            </h1>

            <p>
                Join ALL-IN-ONE.COM
            </p>


            <form id="signupForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <div
                id="message"
                class="form-message"
            ></div>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        const signupForm =
            document.getElementById("signupForm");


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const message =
                    document.getElementById("message");


                message.textContent = "";


                // PASSWORD CHECK

                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.style.color = "red";

                    return;
                }


                // CONFIRM PASSWORD

                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color = "red";

                    return;
                }


                try {

                    // SEND DATA TO DATABASE

                    const response =
                        await fetch(
                            "/api/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        name: name,

                                        email: email,

                                        password: password

                                    })
                            }
                        );


                    const data =
                        await response.json();


                    message.textContent =
                        data.message;


                    if (data.success) {

                        message.style.color =
                            "green";


                        signupForm.reset();


                        setTimeout(
                            function () {

                                window.location.href =
                                    "login.html";

                            },
                            1000
                        );

                    } else {

                        message.style.color =
                            "red";
                    }


                } catch (error) {

                    console.error(error);


                    message.textContent =
                        "Server connection failed. Please start the website server.";

                    message.style.color =
                        "red";
                }

            }
        );

    </script>

</body>

</html>
