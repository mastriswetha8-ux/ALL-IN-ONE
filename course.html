/* =========================================================
   GET COURSE ID
========================================================= */

function getCourseId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("course");
}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value) {

    if (!value) {
        return "";
    }

    return String(value)
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   YOUTUBE EMBED URL
========================================================= */

function getYoutubeEmbedUrl(url) {

    if (!url) {
        return "";
    }

    const value = String(url).trim();


    if (value.includes("/embed/")) {
        return value;
    }


    let videoId = "";


    try {

        const parsed =
            new URL(value);


        if (
            parsed.hostname.includes(
                "youtube.com"
            )
        ) {

            videoId =
                parsed.searchParams.get("v")
                || "";


            if (
                parsed.pathname.startsWith(
                    "/shorts/"
                )
            ) {

                videoId =
                    parsed.pathname
                        .split("/shorts/")[1]
                        .split("/")[0];

            }

        }


        if (
            parsed.hostname ===
            "youtu.be"
        ) {

            videoId =
                parsed.pathname
                    .replace("/", "")
                    .split("/")[0];

        }

    } catch (error) {

        console.warn(
            "Invalid YouTube URL:",
            value
        );

    }


    if (!videoId) {

        const match =
            value.match(
                /(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/
            );


        if (match) {
            videoId = match[1];
        }

    }


    if (!videoId) {
        return "";
    }


    return (
        "https://www.youtube.com/embed/" +
        videoId
    );
}


/* =========================================================
   FIND MATCHING COURSE VIDEO
========================================================= */

function findCourseVideo(
    lesson,
    videos
) {

    if (!Array.isArray(videos)) {
        return null;
    }


    const lessonTitle =
        normalizeText(
            lesson.title
        );


    /* EXACT MATCH */

    let match =
        videos.find(
            video =>
                normalizeText(
                    video.title
                ) === lessonTitle
        );


    if (match) {
        return match;
    }


    /* CONTAINS MATCH */

    match =
        videos.find(
            video => {

                const dbTitle =
                    normalizeText(
                        video.title
                    );


                return (
                    dbTitle.includes(
                        lessonTitle
                    ) ||
                    lessonTitle.includes(
                        dbTitle
                    )
                );
            }
        );


    if (match) {
        return match;
    }


    /* SPECIAL ALIASES */

    const aliases = {

        "b.sc mathematics": [
            "b.sc mathematics",
            "bsc mathematics"
        ],

        "b.sc physics": [
            "b.sc physics",
            "bsc physics",
            "physics"
        ],

        "b.sc computer science": [
            "b.sc computer science",
            "bsc computer science",
            "computer science"
        ],

        "b.a history": [
            "b.a history",
            "ba history"
        ],

        "b.a economics": [
            "b.a economics",
            "ba economics"
        ],

        "b.a political science": [
            "b.a political science",
            "ba political science",
            "political science"
        ],

        "b.com accounting": [
            "b.com accounting",
            "bcom accounting",
            "accounting"
        ],

        "b.com economics": [
            "b.com economics",
            "bcom economics"
        ],

        "b.com business studies": [
            "b.com business studies",
            "bcom business studies",
            "business studies"
        ],

        "introduction to upsc - telugu": [
            "introduction to upsc - telugu",
            "introduction to upsc"
        ],

        "indian polity - telugu": [
            "indian polity - telugu",
            "indian polity"
        ],

        "indian economy - telugu": [
            "indian economy - telugu",
            "indian economy"
        ],

        "arithmetic - telugu": [
            "arithmetic - telugu",
            "arithmetic"
        ],

        "reasoning - telugu": [
            "reasoning - telugu",
            "reasoning"
        ],

        "economy - telugu": [
            "economy - telugu",
            "economy"
        ],

        "polity - telugu": [
            "polity - telugu",
            "polity"
        ],

        "history - telugu": [
            "history - telugu",
            "history"
        ]

    };


    const lessonAliases =
        aliases[lessonTitle];


    if (lessonAliases) {

        match =
            videos.find(
                video => {

                    const dbTitle =
                        normalizeText(
                            video.title
                        );


                    return lessonAliases.some(
                        alias => {

                            const a =
                                normalizeText(
                                    alias
                                );


                            return (
                                dbTitle === a ||
                                dbTitle.includes(a)
                            );
                        }
                    );

                }
            );

    }


    return match || null;
}


/* =========================================================
   CREATE LESSON
========================================================= */

function createLesson(
    lesson,
    number,
    courseVideos
) {

    const matchedVideo =
        findCourseVideo(
            lesson,
            courseVideos
        );


    let videoHTML = "";


    if (matchedVideo) {

        const youtubeUrl =
            matchedVideo.youtube_url ||
            matchedVideo.youtubeUrl ||
            matchedVideo.video_url ||
            matchedVideo.url ||
            "";


        const embedUrl =
            matchedVideo.youtube_embed_url ||
            matchedVideo.youtubeEmbedUrl ||
            getYoutubeEmbedUrl(
                youtubeUrl
            );


        if (embedUrl) {

            videoHTML = `

                <div class="video-container">

                    <iframe
                        src="${embedUrl}"
                        title="${escapeHTML(
                            lesson.title
                        )}"
                        allow="accelerometer;
                        autoplay;
                        clipboard-write;
                        encrypted-media;
                        gyroscope;
                        picture-in-picture;
                        web-share"
                        allowfullscreen>
                    </iframe>

                </div>

            `;

        } else {

            videoHTML = `

                <div class="coming-soon">

                    🎥 Video link is not available

                </div>

            `;

        }

    } else {

        videoHTML = `

            <div class="coming-soon">

                🎥 Video Coming Soon

            </div>

        `;

    }


    return `

        <div class="lesson">

            <h3>
                LESSON ${number}
            </h3>

            <h2>
                ${escapeHTML(
                    lesson.title
                )}
            </h2>

            <p>
                ${escapeHTML(
                    lesson.description
                )}
            </p>

            ${videoHTML}

        </div>

    `;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   LOAD COURSE VIDEOS FROM DATABASE API
========================================================= */

async function loadCourseVideos(
    courseId
) {

    try {

        const response =
            await fetch(
                "/api/course-videos/" +
                encodeURIComponent(
                    courseId
                ),
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            console.error(
                "Course video API error:",
                response.status
            );

            return [];
        }


        const data =
            await response.json();


        console.log(
            "COURSE VIDEO API RESPONSE:",
            data
        );


        /* API MAY RETURN ARRAY */

        if (
            Array.isArray(data)
        ) {

            return data;
        }


        /* API MAY RETURN { videos: [] } */

        if (
            Array.isArray(
                data.videos
            )
        ) {

            return data.videos;
        }


        /* API MAY RETURN { courseVideos: [] } */

        if (
            Array.isArray(
                data.courseVideos
            )
        ) {

            return data.courseVideos;
        }


        return [];

    } catch (error) {

        console.error(
            "Unable to load course videos:",
            error
        );

        return [];
    }
}


/* =========================================================
   LOAD COURSE
========================================================= */

async function loadCourse() {

    const page =
        document.getElementById(
            "pageContent"
        );


    try {

        const courseId =
            getCourseId();


        /* COURSE CHECK */

        if (
            !courseId ||
            !courseData[courseId]
        ) {

            page.innerHTML = `

                <div class="error">

                    <h2>
                        Course Not Found
                    </h2>

                    <p>
                        Please select a valid course
                        from Paid Classes.
                    </p>

                </div>

            `;

            return;
        }


        /* =================================================
           LOGIN CHECK
        ================================================= */

        const meResponse =
            await fetch(
                "/api/me",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const meData =
            await meResponse.json();


        if (!meData.loggedIn) {

            page.innerHTML = `

                <div class="error">

                    <h2>
                        Login Required
                    </h2>

                    <p>
                        Please login before accessing
                        the course.
                    </p>

                    <br>

                    <a href="/login.html">
                        Login Now
                    </a>

                </div>

            `;

            return;
        }


        /* =================================================
           PURCHASE CHECK
        ================================================= */

        const purchaseResponse =
            await fetch(
                "/api/my-purchases",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const purchaseData =
            await purchaseResponse.json();


        const purchases =
            purchaseData.purchases || [];


        const hasPurchase =
            purchases.some(
                purchase => {

                    return (
                        String(
                            purchase.course_id ||
                            purchase.courseId
                        ) ===
                        String(courseId)
                    );

                }
            );


        if (!hasPurchase) {

            page.innerHTML = `

                <div class="error">

                    <h2>
                        Course Access Not Granted
                    </h2>

                    <p>
                        You have not purchased
                        this course yet.
                    </p>

                    <br>

                    <a href="/paid-classes.html">
                        Go to Paid Classes
                    </a>

                </div>

            `;

            return;
        }


        /* =================================================
           COURSE DATA
        ================================================= */

        const course =
            courseData[courseId];


        /* =================================================
           GET VIDEOS FROM DATABASE
        ================================================= */

        const courseVideos =
            await loadCourseVideos(
                courseId
            );


        console.log(
            "COURSE ID:",
            courseId
        );

        console.log(
            "TOTAL COURSE VIDEOS:",
            courseVideos.length
        );


        console.log(
            "COURSE VIDEOS:",
            courseVideos
        );


        /* =================================================
           COURSE HEADER
        ================================================= */

        let html = `

            <div class="course-header">

                <h1>
                    📚 ${escapeHTML(
                        course.name
                    )}
                </h1>

                <p>
                    ${escapeHTML(
                        course.description
                    )}
                </p>

                <p class="student">

                    👤 Student:

                    <strong>
                        ${escapeHTML(
                            meData.user.name
                        )}
                    </strong>

                </p>

                <div class="access">

                    ✅ Course Access Granted

                </div>

            </div>

            <div class="success-message">

                🎓 You can now access your
                purchased course lessons.

            </div>

            <h2 class="section-title">

                🎓 Course Lessons

            </h2>

        `;


        /* =================================================
           UPSC / COMPETITIVE LESSONS
        ================================================= */

        if (course.lessons) {

            course.lessons.forEach(
                (lesson, index) => {

                    html +=
                        createLesson(
                            lesson,
                            index + 1,
                            courseVideos
                        );

                }
            );

        }


        /* =================================================
           DEGREE SECTIONS
        ================================================= */

        if (course.sections) {

            course.sections.forEach(
                section => {

                    html += `

                        <div class="subject-title">

                            📘 ${escapeHTML(
                                section.name
                            )}

                        </div>

                    `;


                    section.lessons.forEach(
                        (lesson, index) => {

                            html +=
                                createLesson(
                                    lesson,
                                    index + 1,
                                    courseVideos
                                );

                        }
                    );

                }
            );

        }


        page.innerHTML = html;


        console.log(
            "COURSE PAGE LOADED SUCCESSFULLY"
        );

    } catch (error) {

        console.error(
            "COURSE PAGE ERROR:",
            error
        );


        page.innerHTML = `

            <div class="error">

                <h2>
                    Unable to load course
                </h2>

                <p>
                    Please refresh the page
                    and try again.
                </p>

            </div>

        `;
    }
}
